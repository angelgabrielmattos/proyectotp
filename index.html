<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    
    <main class="container">
    
    <header class="topbar">
        <h1>Character Counter</h1>
    </header>
        
    <section>
    
        <h2>Analyze your text in real-time.</h2>
        
        <div class="textarea-box">
            <textarea placeholder="Write something...">
Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly.
    </textarea>
    </div>
    
    <div class="options">
        
        <label>
            <input type="checkbox">
            Exclude Spaces
        </label>
        
        <label>
            <input type="checkbox">
            Set Character Limit
        </label>
        
        <p>Approx. reading time: &lt;1 minute</p>
    </div>
    
    </section>
    
    <section>
        
        <article>
            <h3>278</h3>
            <p>Total Characters</p>
        </article>
        
        <article>
            <h3>39</h3>
            <p>Word Count</p>
        </article>
        
        <article>
            <h3>4</h3>
            <p>Sentence Count</p>
        </article>
        
        </section>
        
        <section>
            
            <h4>Letter Density</h4>
            
            <div>
                <span>E</span>
        <span>40 (16.06%)</span>
        </div>
        
            <div>
                <span>I</span>
        <span>29 (11.65%)</span>
        </div>
        
            <div>
                <span>T</span>
        <span>28 (11.24%)</span>
        </div>
        
            <div>
                <span>O</span>
        <span>22 (8.84%)</span>
        </div>
        
            <div>
                <span>N</span>
        <span>21 (8.43%)</span>
        
        </div>
        
        <button>See more</button>
        </section>
    
    </main>
    
</body>
</html>
