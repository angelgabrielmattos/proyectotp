<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Counter</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Saira:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">

    <div class="topbar">
        <div class="logo">
        <img src="assets/images/logoo.png" alt="Character Counter Logo">
        <span class="title">Character Counter</span>
        </div>

        <button class="theme-btn">☀</button>
    </div>

    <h1>
        Analyze your text <br />
        in real-time.
    </h1>

    <div class="textarea-box">
        <textarea placeholder="Write something...">
Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly.
        </textarea>
    </div>

    <div class="options">
        <label>
        <input type="checkbox">
        Exclude Spaces
        </label>

        <label>
        <input type="checkbox">
        Set Character Limit
        </label>

        <span>Approx. reading time: &lt;1 minute</span>
    </div>

    <div class="cards">

        <div class="card purple">
            <img src="assets/images/falling-triangles.svg" alt="card-background">
        <h2>278</h2>
        <p>Total Characters</p>
        </div>

        <div class="card orange">
            <img src="assets/images/falling-triangles.svg" alt="card-background">
        <h2>39</h2>
        <p>Word Count</p>
        </div>

        <div class="card coral">
            <img src="assets/images/falling-triangles.svg" alt="card-background">
        <h2>04</h2>
        <p>Sentence Count</p>
        </div>

    </div>

    <div class="density">

        <h3>Letter Density</h3>

        <div class="density-item">
        <span>E</span>

        <div class="bar">
            <div class="fill" style="width: 30%;"></div>
        </div>

        <span>40 (16.06%)</span>
        </div>

        <div class="density-item">
        <span>I</span>

        <div class="bar">
            <div class="fill" style="width: 19%;"></div>
        </div>

        <span>29 (11.65%)</span>
        </div>

        <div class="density-item">
        <span>T</span>

        <div class="bar">
            <div class="fill" style="width: 18%;"></div>
        </div>

        <span>28 (11.24%)</span>
        </div>

        <div class="density-item">
        <span>O</span>

        <div class="bar">
            <div class="fill" style="width: 12%;"></div>
        </div>

        <span>22 (8.84%)</span>
        </div>

        <div class="density-item">
        <span>N</span>

        <div class="bar">
            <div class="fill" style="width: 11%;"></div>
        </div>

        <span>21 (8.43%)</span>
        </div>

        <a href="#">See more ↓</a>

    </div>

    </div>

</body>
</html>
